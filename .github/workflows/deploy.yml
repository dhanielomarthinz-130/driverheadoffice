name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: Sync Code to InfinityFree FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            scratch/**
            uploads/**
            .mcp.json
            testsprite_tests/**
            README.md

      - name: 🗄️ Trigger Database Migration (if WEBSITE_URL secret is set)
        env:
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
        run: |
          if [ -n "$WEBSITE_URL" ]; then
            TOKEN="${MIGRATE_TOKEN:-tms_secret_migration_key_8899}"
            # Remove trailing slash if any
            CLEAN_URL="${WEBSITE_URL%/}"
            echo "Memanggil migrasi database ke: $CLEAN_URL/migrate.php"
            curl -s -L "$CLEAN_URL/migrate.php?token=$TOKEN" || true
          else
            echo "Secret WEBSITE_URL belum diatur, melewati trigger migrasi otomatis."
          fi
